name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: macos-26
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Show Swift version
      run: swift --version
      
    - name: Run tests
      run: swift test
